<!doctype html>
<html lang="zh-Hant">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#f5efdf">
  <title>新增一餐｜今天吃什麼？</title>
  <link rel="stylesheet" href="styles/album.css">
  <link rel="stylesheet" href="styles/new-meal.css">
  <script src="src/new-meal.js" defer></script>
</head>
<body>
  <header class="masthead">
    <a class="album-title" href="index.html">今天吃什麼？</a>
    <a class="return-link" href="index.html">回相簿 ↗</a>
  </header>
  <main class="composer">
    <h1 id="page-title" tabindex="-1">新增一餐</h1>
    <div class="notice" id="access" role="status">正在讀取相簿…</div>
    <noscript>請啟用 JavaScript 以新增餐點。</noscript>
    <form id="meal-form" hidden>
      <fieldset class="panel">
        <legend>這次去哪裡吃？</legend>
        <label>店家<select id="shop-select" required></select></label>
        <p id="shop-address" class="hint" hidden></p>
        <fieldset id="new-shop" class="field-group" hidden disabled>
          <legend class="visually-hidden">新店家資訊</legend>
          <div class="grid">
            <label>店名（含分店名）<input id="shop-name" maxlength="100" required></label>
            <label>英文店名 <small>選填</small><input id="shop-english" maxlength="100"></label>
            <label>縣市<input id="shop-city" list="city-list" placeholder="例：臺北市" required maxlength="40"></label>
            <label>行政區<input id="shop-district" list="district-list" placeholder="例：文山區" required maxlength="40"></label>
          </div>
          <label>地址 <small>選填</small><input id="shop-street" maxlength="220"></label>
          <datalist id="city-list"></datalist><datalist id="district-list"></datalist>
        </fieldset>
        <label class="date-label">用餐日期<input type="date" id="visit-date" required></label>
      </fieldset>
      <div id="dish-list"></div>
      <button type="button" id="add-dish" class="secondary">＋ 加一道餐點</button>
      <div class="action-row"><button type="submit" class="primary">預覽這一餐 →</button></div>
    </form>
    <section id="preview" hidden aria-labelledby="page-title">
      <div id="preview-shop"></div>
      <div id="preview-dishes"></div>
      <div class="action-row">
        <button type="button" id="back-edit" class="secondary">回去修改</button>
        <button type="button" id="publish" class="primary">確認發布</button>
      </div>
    </section>
    <p id="feedback" class="feedback" role="status" aria-live="polite"></p>
  </main>
  <template id="dish-template">
    <fieldset class="panel dish">
      <legend class="dish-heading">餐點</legend>
      <div class="dish-tools"><button type="button" class="remove text-button">移除這道</button></div>
      <label class="old-dish-wrap" hidden>相簿裡的餐點<select class="old-dish"></select></label>
      <label>菜名<input class="dish-name" required maxlength="100"></label>
      <fieldset class="field-group types"><legend>餐點類型 <small>可複選</small></legend><div class="pills"></div></fieldset>
      <div class="grid">
        <label>價格（元） <small>選填</small><input class="price-field" type="number" inputmode="numeric" min="0" max="999999" step="1"></label>
        <label>誰點的 <small>選填</small><select class="orderer"><option value="">未記錄</option><option>我</option><option>男友</option><option>一起點</option></select></label>
      </div>
      <label>餐點實拍照<input class="file" type="file" accept="image/*" required></label>
      <p class="file-status hint" role="status"></p>
      <img class="thumbnail" alt="所選餐點照片" hidden>
      <label>本次餐點評分 <small>選填</small><select class="score"><option value="">未評分</option></select></label>
      <div class="score-picker" aria-label="點選星星，也可以使用上方選單"></div>
      <div class="grid notes-grid">
        <label>我的心得 <small>選填</small><textarea class="mine" rows="3" maxlength="2000"></textarea></label>
        <label>男友的心得 <small>選填</small><textarea class="partner" rows="3" maxlength="2000"></textarea></label>
      </div>
    </fieldset>
  </template>
</body>
</html>
